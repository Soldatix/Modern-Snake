name: Upgrade Modern Snake Info

on:
  push:
    paths:
      - '.github/workflows/upgrade-modern-snake-info.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Info
        run: python .github/scripts/upgrade-modern-snake-info.py
      - name: Verify content
        run: |
          grep -q 'id="snake-standard-info"' index.html
          grep -q 'Doniraj putem PayPala' index.html
          grep -q 'Kopirano!' index.html
          grep -q "\['BTC','bc1qwlrxrh64peukga0fp59m9yg7gpf0yj8q7fxnsc'\]" index.html
          grep -q "\['RVN','RAtXzKZyB3awfq2u2cK8YppC9kJamU5tPQ'\]" index.html
          grep -q 'snake-copy-btn' index.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'application/ld+json' not in attrs.lower(): scripts.append(body)
          Path('/tmp/modern-snake-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/modern-snake-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Modern Snake Info design"
          git push
